[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Vite reads these at build time. Set them in the Netlify site settings.
# VITE_SUPABASE_URL
# VITE_SUPABASE_ANON_KEY
# Without those, RSVPs are shared through the party function and Netlify Blobs.

[[redirects]]
  from = "/api/party"
  to = "/.netlify/functions/party"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
